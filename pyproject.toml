[project]
name = "run-simulator"
version = "0.1.0"
description = "Cartoon 2D endless runner built with pygame-ce"
readme = "README.md"
authors = [
    { name = "dmitryminchuk", email = "dmitry.s.minchuk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
run-simulator = "run_simulator.__main__:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
